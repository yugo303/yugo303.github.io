<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>yugo303 ポートフォリオ</title>
<meta name="robots" content="noindex">
<meta name="description" content="yugo303 が作ったもの。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root {
  --paper: #F2F5F8; --panel: #FFFFFF; --ink: #15202B; --muted: #5A6877; --line: #D6DDE4; --sun: #E8660F;
  --f-display: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #12181F; --panel: #1C252F; --ink: #F1F4F7; --muted: #BAC5D0; --line: #374452; --sun: #FF8E42; color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--f-body); line-height: 1.8;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
.wrap { max-width: 760px; margin: 0 auto; padding-block: 64px; display: grid; gap: 40px; }
h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(32px, 6vw, 48px); margin: 0; }
.label { font-family: var(--f-mono); font-size: 12px; letter-spacing: 0.08em; color: var(--muted); }
p { margin: 0; color: var(--muted); }
a.work { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0; text-decoration: none; color: inherit;
  background: var(--panel); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
a.work img { display: block; width: 100%; height: auto; border-bottom: 1px solid var(--line); }
a.work div { padding: 18px 20px; display: grid; gap: 4px; }
a.work b { font-size: 18px; }
a.work span { color: var(--sun); font-size: 14px; font-weight: 500; }
a.work:hover b, a.work:focus-visible b { text-decoration: underline; }
a.work:focus-visible { outline: 2px solid var(--sun); outline-offset: 3px; }
</style>
</head>
<body>
<div class="wrap">
  <header style="display: grid; gap: 8px;">
    <span class="label">PORTFOLIO</span>
    <h1>yugo303</h1>
    <p>作ったものをまとめています。</p>
  </header>
  <section style="display: grid; gap: 16px;">
    <span class="label">作ったもの</span>
    <a class="work" href="photospot/">
      <img src="photospot/og.png" alt="撮りの目の紹介ページの冒頭" width="1200" height="630">
      <div>
        <b>撮りの目</b>
        <p>地形と地図のデータから景色のいい場所を見つけ、スマホでの撮り方まで教える Android / iOS アプリ。</p>
        <span>制作の記録を見る →</span>
      </div>
    </a>
    <a class="work" href="care-memo/">
      <img src="care-memo/og.png" alt="介護メモの紹介ページの冒頭" width="1200" height="630" loading="lazy">
      <div>
        <b>介護メモ</b>
        <p>ケアマネジャーが訪問先でスマホに話した内容を AI が記録の形に整え、事業所のパソコンへ QR コードで渡すウェブアプリ。</p>
        <span>制作の記録を見る →</span>
      </div>
    </a>
    <a class="work" href="valorant-coach/">
      <img src="valorant-coach/og.png" alt="VALORANT 振り返りコーチの紹介ページの冒頭" width="1200" height="630" loading="lazy">
      <div>
        <b>VALORANT 振り返りコーチ</b>
        <p>VALORANT の試合映像から、ラウンドごとの勝率の動きと不利になった理由を言葉で返す Windows アプリ。プロの配信から作戦の一覧も作る。</p>
        <span>制作の記録を見る →</span>
      </div>
    </a>
  </section>
</div>
</body>
</html>
